<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Smooth By GodYew007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  @property --spin { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root {
    --bg: #050508; --text: #f5f4f8; --muted: #a5a3b3;
    --cyan: #25f4ee; --red: #fe2c55;
    --ok: #7df0c0; --warn: #ffc56b; --err: #ff7d8e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); overflow-x: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #15101f 0%, var(--bg) 60%);
    font: 16px/1.6 "Prompt", "Leelawadee UI", "Segoe UI", system-ui, sans-serif;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.6s ease; }
  #scene.ready { opacity: 1; }
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(55% 40% at 50% 40%, rgba(5, 5, 8, .4) 0%, transparent 100%),
      linear-gradient(to bottom, rgba(5, 5, 8, .6) 0%, transparent 25%, transparent 85%, rgba(5, 5, 8, .5) 100%);
  }

  main {
    position: relative; min-height: 100%; max-width: 760px; margin: 0 auto; padding: 56px 16px 40px;
    display: flex; flex-direction: column; justify-content: center;
  }
  main > * { animation: rise .9s cubic-bezier(.2, .8, .2, 1) both; }
  main > :nth-child(2) { animation-delay: .08s; }
  main > :nth-child(3) { animation-delay: .16s; }
  main > :nth-child(4) { animation-delay: .24s; }
  main > :nth-child(5) { animation-delay: .32s; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }

  .badge {
    align-self: center; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px; padding: 5px 14px; margin-bottom: 22px;
    background: rgba(255, 255, 255, .04); backdrop-filter: blur(8px);
  }
  .badge i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); margin-right: 8px; box-shadow: 0 0 10px var(--cyan); }
  h1 {
    font: 800 clamp(30px, 8.6vw, 70px)/1.05 "Unbounded", "Prompt", sans-serif; margin: 0; text-align: center; letter-spacing: -.03em;
    text-shadow: -3px -2px 0 rgba(37, 244, 238, .85), 3px 2px 0 rgba(254, 44, 85, .85), 0 0 60px rgba(255, 255, 255, .25);
  }
  .sub { text-align: center; color: #cfcdda; margin: 20px auto 34px; max-width: 520px; font-weight: 300; font-size: 17px; }
  .sub b { font-weight: 500; color: #fff; }

  .panel {
    position: relative; border-radius: 28px; padding: 22px;
    background: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
    border: 1px solid rgba(255, 255, 255, .12);
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .12);
  }
  /* rotating two-colour rim */
  #drop {
    position: relative; display: block; border-radius: 20px; padding: 2px; cursor: pointer;
    background: conic-gradient(from var(--spin), var(--cyan), transparent 25%, transparent 50%, var(--red), transparent 75%, transparent 100%, var(--cyan));
    animation: spin 6s linear infinite; transition: transform .25s ease, filter .25s ease;
  }
  @keyframes spin { to { --spin: 360deg; } }
  #drop .inner {
    border-radius: 18px; padding: 46px 16px; text-align: center;
    background: rgba(8, 8, 13, .93); transition: background .25s ease;
  }
  #drop:hover, #drop.over, #drop:focus-within { transform: scale(1.012); filter: drop-shadow(0 0 22px rgba(37, 244, 238, .35)) drop-shadow(0 0 22px rgba(254, 44, 85, .3)); animation-duration: 1.8s; }
  #drop.over .inner { background: rgba(8, 8, 13, .78); }
  #drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .icon {
    width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .16);
  }
  #drop:hover .icon svg, #drop.over .icon svg { transform: translateY(-3px); }
  .icon svg { transition: transform .25s ease; }
  #drop strong { display: block; font-size: 21px; font-weight: 600; }
  #drop span { color: var(--muted); font-size: 14px; font-weight: 300; }

  #result { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.2, .8, .2, 1); }
  #result.show { grid-template-rows: 1fr; }
  #result > div { overflow: hidden; }
  .name { font-weight: 500; word-break: break-all; margin: 20px 4px 12px; }
  dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0 0 14px; }
  dl div {
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); border-radius: 14px; padding: 10px 12px;
    animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
  }
  dl div:nth-child(2) { animation-delay: .05s; } dl div:nth-child(3) { animation-delay: .1s; }
  dl div:nth-child(4) { animation-delay: .15s; } dl div:nth-child(5) { animation-delay: .2s; }
  dt { color: var(--muted); font-size: 12px; font-weight: 300; }
  dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .msg { font-size: 14px; margin: 0 4px 14px; min-height: 1.6em; }
  .msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); } .msg.err { color: var(--err); }
  a.btn {
    display: block; text-align: center; color: #fff; text-decoration: none; font-weight: 600; font-size: 17px;
    padding: 15px; border-radius: 999px; background: linear-gradient(100deg, #12c9c4, #7b5cff 50%, var(--red));
    background-size: 200% 100%; transition: background-position .5s ease, transform .2s ease, box-shadow .3s ease;
    box-shadow: 0 10px 34px rgba(123, 92, 255, .4);
  }
  a.btn:hover { background-position: 100% 0; transform: translateY(-2px); box-shadow: 0 14px 44px rgba(254, 44, 85, .45); }
  a.btn[hidden] { display: none; }

  .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 24px 0 0; padding: 0; list-style: none; }
  .pills li {
    font-size: 13px; color: #d9d7e4; padding: 6px 14px; border-radius: 999px;
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); backdrop-filter: blur(8px);
  }

  @media (prefers-reduced-motion: reduce) {
    main > *, dl div { animation: none; }
    #drop { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="veil"></div>

<main>
  <div class="badge"><i></i>Smooth V1 · อัปผ่านคอม</div>
  <h1>TikTok Smooth Made By GodYew007</h1>
  <p class="sub">ปรับไฟล์ให้พร้อมอัป TikTok <b>โดยไม่เข้ารหัสใหม่</b><br>ภาพและเสียงเหมือนต้นฉบับทุกไบต์</p>

  <div class="panel">
    <label id="drop">
      <div class="inner">
        <input type="file" id="file" accept="video/mp4,video/quicktime,.mp4,.mov">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
        </div>
        <strong>วางวิดีโอ MP4 หรือ MOV ที่นี่</strong>
        <span>หรือคลิกเพื่อเลือกไฟล์</span>
      </div>
    </label>

    <div id="result" aria-live="polite"><div>
      <div class="name" id="name"></div>
      <dl id="info"></dl>
      <p class="msg" id="msg"></p>
      <a class="btn" id="download" hidden>ดาวน์โหลดไฟล์ Smooth</a>
    </div></div>
  </div>

  <ul class="pills">
    <li>1080p · 2K · 4K</li>
    <li>60 / 120 fps</li>
    <li>ไม่จำกัดขนาดไฟล์</li>
    <li>ไฟล์ไม่ออกจากเครื่องคุณ</li>
  </ul>
</main>

<script src="patcher.js"></script>
<script>
  // The 3D scene replaces these hooks once it loads; the page works without it.
  window.fx = { energy() {}, ripple() {} };

  const $ = (id) => document.getElementById(id);
  const drop = $('drop');
  let lastUrl = null;

  const VIDEO_CODECS = { avc1: 'H.264', avc3: 'H.264', hvc1: 'H.265', hev1: 'H.265' };
  const AUDIO_CODECS = { mp4a: 'AAC' };
  const mbps = (bps) => (bps / 1e6).toFixed(1) + ' Mbps';
  const sizeText = (n) => (n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : (n / 1e6).toFixed(1) + ' MB');

  function setMsg(kind, text) {
    $('msg').className = 'msg ' + kind;
    $('msg').textContent = text;
  }

  function showInfo(rows) {
    $('info').replaceChildren(...rows.map(([k, v]) => {
      const div = document.createElement('div');
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      div.append(dt, dd);
      return div;
    }));
  }

  async function handle(file) {
    if (!file) return;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    $('result').classList.add('show');
    $('name').textContent = file.name;
    $('download').hidden = true;
    showInfo([]);
    setMsg('', 'กำลังประมวลผล…');
    fx.energy(2.4);
    try {
      const { blob, video, audio } = await TikTokSmooth.patchFile(file);
      const vCodec = VIDEO_CODECS[video.codec];
      const aCodec = audio && AUDIO_CODECS[audio.codec];
      showInfo([
        ['ความละเอียด', `${video.width} × ${video.height}`],
        ['เฟรมเรต', video.fps ? `${+video.fps.toFixed(2)} fps` : '-'],
        ['วิดีโอ', `${vCodec || video.codec}${video.bitrate ? ' · ' + mbps(video.bitrate) : ''}`],
        ['เสียง', audio ? `${aCodec || audio.codec} · ${audio.sampleRate / 1000} kHz` : 'ไม่มี'],
        ['ขนาดไฟล์', sizeText(blob.size)],
      ]);
      if (vCodec && (aCodec || !audio)) setMsg('ok', 'พร้อมแล้ว — ภาพและเสียงไม่ถูกแตะต้อง แก้เฉพาะข้อมูลส่วนหัวของไฟล์');
      else setMsg('warn', 'สร้างไฟล์ได้ แต่ TikTok แนะนำวิดีโอ H.264/H.265 กับเสียง AAC ไฟล์นี้ใช้ตัวเข้ารหัสอื่น');

      const dot = file.name.lastIndexOf('.');
      const a = $('download');
      a.href = lastUrl = URL.createObjectURL(blob);
      a.download = (dot > 0 ? file.name.slice(0, dot) : file.name) + '-smooth' + (dot > 0 ? file.name.slice(dot) : '.mp4');
      a.hidden = false;
      fx.ripple();
    } catch (e) {
      setMsg('err', e.message || String(e));
    }
    fx.energy(1);
  }

  $('file').addEventListener('change', (e) => { handle(e.target.files[0]); e.target.value = ''; });
  for (const ev of ['dragenter', 'dragover']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); fx.energy(2.4); });
  for (const ev of ['dragleave', 'drop']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); fx.energy(1); });
  drop.addEventListener('drop', (e) => handle(e.dataTransfer.files[0]));
  // a file dropped outside the zone should not navigate away from the page
  for (const ev of ['dragover', 'drop']) window.addEventListener(ev, (e) => e.preventDefault());
</script>

<script type="module">
  // Background: a field of points riding a noise wave, tinted cyan-to-red.
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

  const canvas = document.getElementById('scene');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: 'high-performance' });
  const pixelRatio = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(pixelRatio);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);

  const small = innerWidth < 700;
  // dense along x, sparse along z, so the points read as flowing silk threads
  const COLS = small ? 300 : 560, ROWS = small ? 64 : 84;
  const W = small ? 22 : 40, D = 24;
  const pos = new Float32Array(COLS * ROWS * 3);
  for (let r = 0, i = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++, i += 3) {
      pos[i] = (c / (COLS - 1) - 0.5) * W;
      pos[i + 2] = (r / (ROWS - 1) - 0.5) * D - 5;
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  const uniforms = {
    uTime: { value: 0 }, uEnergy: { value: 1 }, uRipple: { value: 99 }, uPixel: { value: pixelRatio },
    uCyan: { value: new THREE.Color('#25f4ee') }, uRed: { value: new THREE.Color('#fe2c55') },
  };
  const material = new THREE.ShaderMaterial({
    uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */ `
      uniform float uTime, uEnergy, uRipple, uPixel;
      varying float vHeight, vFade, vMix;

      vec3 permute(vec3 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
      float snoise(vec2 v) {
        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
        vec2 i = floor(v + dot(v, C.yy));
        vec2 x0 = v - i + dot(i, C.xx);
        vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod(i, 289.0);
        vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
        vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
        m = m * m; m = m * m;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
        vec3 g;
        g.x = a0.x * x0.x + h.x * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
      }

      void main() {
        vec3 p = position;
        float t = uTime;
        float broad = snoise(vec2(p.x * 0.11 + t * 0.05, p.z * 0.14 - t * 0.09));
        float fine = snoise(vec2(p.x * 0.34 - t * 0.11, p.z * 0.4 + t * 0.07));
        float y = broad * 1.25 + fine * 0.32 * uEnergy;
        y += sin(p.x * 0.45 + t * 0.6) * 0.22 + sin(p.z * 0.7 - t * 0.8) * 0.18 * uEnergy;

        // success ripple spreading outward from under the card
        float d = length(p.xz - vec2(0.0, -1.0));
        float front = uRipple * 5.0;
        float ring = exp(-pow(d - front, 2.0) * 0.5) * max(0.0, 1.0 - uRipple / 3.5);
        y += ring * 1.6;

        p.y = y;
        vHeight = y;
        vMix = smoothstep(-5.0, 5.0, p.x * 0.6 + broad * 5.0 + sin(t * 0.15 + p.z * 0.2) * 3.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float crest = smoothstep(0.2, 1.6, y) + ring * 1.5;
        gl_PointSize = uPixel * (2.0 + crest * 2.6) * (13.0 / -mv.z);
        vFade = smoothstep(26.0, 9.0, -mv.z) * smoothstep(0.8, 3.0, -mv.z) * (0.6 + crest * 0.9);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */ `
      uniform vec3 uCyan, uRed;
      varying float vHeight, vFade, vMix;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.05, d);
        vec3 col = mix(uCyan, uRed, vMix);
        col = mix(col, vec3(1.0), smoothstep(0.9, 2.2, vHeight) * 0.7);
        gl_FragColor = vec4(col, a * vFade);
      }`,
  });
  scene.add(new THREE.Points(geometry, material));

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  const mouse = { x: 0, y: 0 }, look = { x: 0, y: 0 };
  addEventListener('pointermove', (e) => { mouse.x = e.clientX / innerWidth - 0.5; mouse.y = e.clientY / innerHeight - 0.5; });

  let energyTarget = 1;
  window.fx = {
    energy(v) { energyTarget = v; },
    ripple() { uniforms.uRipple.value = 0; if (still) render(0); },
  };

  let last = performance.now();
  function render(dt) {
    uniforms.uEnergy.value += (energyTarget - uniforms.uEnergy.value) * Math.min(1, dt * 3);
    uniforms.uTime.value += dt * (0.55 + 0.45 * uniforms.uEnergy.value);
    uniforms.uRipple.value += dt;
    look.x += (mouse.x - look.x) * Math.min(1, dt * 2.5);
    look.y += (mouse.y - look.y) * Math.min(1, dt * 2.5);
    camera.position.set(look.x * 2.2, 2.1 - look.y * 0.8, 7.5);
    camera.lookAt(look.x * 0.6, 0.6, -4);
    renderer.render(scene, camera);
  }
  function loop(now) {
    render(Math.min(0.05, (now - last) / 1000));
    last = now;
    requestAnimationFrame(loop);
  }
  if (still) render(0); else requestAnimationFrame(loop);
  canvas.classList.add('ready');
</script>
</body>
</html>
