<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Smooth By GodYew007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* rotating two-colour rim */
  #drop {
    position: relative; display: block; border-radius: 20px; padding: 2px; cursor: pointer;
    background: conic-gradient(from var(--spin), var(--cyan), transparent 25%, transparent 50%, var(--red), transparent 75%, transparent 100%, var(--cyan));
    animation: spin 6s linear infinite; transition: transform .25s ease, filter .25s ease;
  }
  @keyframes spin { to { --spin: 360deg; } }
  #drop .inner {
    border-radius: 18px; padding: 46px 16px; text-align: center;
    background: rgba(8, 8, 13, .93); transition: background .25s ease;
  }
  #drop:hover, #drop.over, #drop:focus-within { transform: scale(1.012); filter: drop-shadow(0 0 22px rgba(37, 244, 238, .35)) drop-shadow(0 0 22px rgba(254, 44, 85, .3)); animation-duration: 1.8s; }
  #drop.over .inner { background: rgba(8, 8, 13, .78); }
  #drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .icon {
    width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .16);
  }
  #drop:hover .icon svg, #drop.over .icon svg { transform: translateY(-3px); }
  .icon svg { transition: transform .25s ease; }
  #drop strong { display: block; font-size: 21px; font-weight: 600; }
  #drop span { color: var(--muted); font-size: 14px; font-weight: 300; }

  #result { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.2, .8, .2, 1); }
  #result.show { grid-template-rows: 1fr; }
  #result > div { overflow: hidden; }
  .name { font-weight: 500; word-break: break-all; margin: 20px 4px 12px; }

  @media (prefers-reduced-motion: reduce) {
    #drop { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="veil"></div>
<nav class="nav"><a href="index.html" aria-current="page">Smooth</a><a href="download.html">ดาวน์โหลดคลิป</a><a href="mp3.html">แปลงเป็น MP3</a></nav>

<main>
  <div class="badge"><i></i>Smooth V1 · อัปผ่านคอม</div>
  <h1>TikTok Smooth Made By GodYew007</h1>
  <p class="sub">ปรับไฟล์ให้พร้อมอัป TikTok <b>โดยไม่เข้ารหัสใหม่</b><br>ภาพและเสียงเหมือนต้นฉบับทุกไบต์</p>

  <div class="panel">
    <label id="drop">
      <div class="inner">
        <input type="file" id="file" accept="video/mp4,video/quicktime,.mp4,.mov">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
        </div>
        <strong>วางวิดีโอ MP4 หรือ MOV ที่นี่</strong>
        <span>หรือคลิกเพื่อเลือกไฟล์</span>
      </div>
    </label>

    <div id="result" aria-live="polite"><div>
      <div class="name" id="name"></div>
      <dl id="info"></dl>
      <p class="msg" id="msg"></p>
      <a class="btn" id="download" hidden>ดาวน์โหลดไฟล์ Smooth</a>
    </div></div>
  </div>

  <ul class="pills">
    <li>1080p · 2K · 4K</li>
    <li>60 / 120 fps</li>
    <li>ไม่จำกัดขนาดไฟล์</li>
    <li>ไฟล์ไม่ออกจากเครื่องคุณ</li>
  </ul>
</main>

<script src="patcher.js"></script>
<script>
  // The 3D scene replaces these hooks once it loads; the page works without it.
  window.fx = { energy() {}, ripple() {} };

  const $ = (id) => document.getElementById(id);
  const drop = $('drop');
  let lastUrl = null;

  const VIDEO_CODECS = { avc1: 'H.264', avc3: 'H.264', hvc1: 'H.265', hev1: 'H.265' };
  const AUDIO_CODECS = { mp4a: 'AAC' };
  const mbps = (bps) => (bps / 1e6).toFixed(1) + ' Mbps';
  const sizeText = (n) => (n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : (n / 1e6).toFixed(1) + ' MB');

  function setMsg(kind, text) {
    $('msg').className = 'msg ' + kind;
    $('msg').textContent = text;
  }

  function showInfo(rows) {
    $('info').replaceChildren(...rows.map(([k, v]) => {
      const div = document.createElement('div');
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      div.append(dt, dd);
      return div;
    }));
  }

  async function handle(file) {
    if (!file) return;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    $('result').classList.add('show');
    $('name').textContent = file.name;
    $('download').hidden = true;
    showInfo([]);
    setMsg('', 'กำลังประมวลผล…');
    fx.energy(2.4);
    try {
      const { blob, video, audio } = await TikTokSmooth.patchFile(file);
      const vCodec = VIDEO_CODECS[video.codec];
      const aCodec = audio && AUDIO_CODECS[audio.codec];
      showInfo([
        ['ความละเอียด', `${video.width} × ${video.height}`],
        ['เฟรมเรต', video.fps ? `${+video.fps.toFixed(2)} fps` : '-'],
        ['วิดีโอ', `${vCodec || video.codec}${video.bitrate ? ' · ' + mbps(video.bitrate) : ''}`],
        ['เสียง', audio ? `${aCodec || audio.codec} · ${audio.sampleRate / 1000} kHz` : 'ไม่มี'],
        ['ขนาดไฟล์', sizeText(blob.size)],
      ]);
      if (vCodec && (aCodec || !audio)) setMsg('ok', 'พร้อมแล้ว — ภาพและเสียงไม่ถูกแตะต้อง แก้เฉพาะข้อมูลส่วนหัวของไฟล์');
      else setMsg('warn', 'สร้างไฟล์ได้ แต่ TikTok แนะนำวิดีโอ H.264/H.265 กับเสียง AAC ไฟล์นี้ใช้ตัวเข้ารหัสอื่น');

      const dot = file.name.lastIndexOf('.');
      const a = $('download');
      a.href = lastUrl = URL.createObjectURL(blob);
      a.download = (dot > 0 ? file.name.slice(0, dot) : file.name) + '-smooth' + (dot > 0 ? file.name.slice(dot) : '.mp4');
      a.hidden = false;
      fx.ripple();
    } catch (e) {
      setMsg('err', e.message || String(e));
    }
    fx.energy(1);
  }

  $('file').addEventListener('change', (e) => { handle(e.target.files[0]); e.target.value = ''; });
  for (const ev of ['dragenter', 'dragover']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); fx.energy(2.4); });
  for (const ev of ['dragleave', 'drop']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); fx.energy(1); });
  drop.addEventListener('drop', (e) => handle(e.dataTransfer.files[0]));
  // a file dropped outside the zone should not navigate away from the page
  for (const ev of ['dragover', 'drop']) window.addEventListener(ev, (e) => e.preventDefault());
</script>

<script type="module" src="scene.js"></script>
</body>
</html>
